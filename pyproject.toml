[project]
name = "argsig"
version = "0.1.2"
description = "A modern, signature-driven CLI framework. Auto-infer type, choices, and nargs directly from type hints and Annotated."
readme = "README.md"
authors = [
    { name = "Avery Zhou X", email = "leisure-zyf@qq.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
argsig = "argsig:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
